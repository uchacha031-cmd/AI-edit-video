name: Video Editor CI

on:
  push:
    branches:
      - fix/ai-auto-video-editor-2026-10-08
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and FFmpeg smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Smoke-test editor and renderer
        run: npm test
